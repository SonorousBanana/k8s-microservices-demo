<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Dashboard</title>
     <style>
        /* --- Όλο το style.css εδώ --- */
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: #c9cbce; color: #333; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { font-size: 2.5rem; color: #2c3e50; }
        button { padding: 0.5rem 1rem; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        section { margin-bottom: 2rem; }
        h2 { color: #34495e; margin-bottom: 1rem; border-bottom: 2px solid #3498db; display: inline-block; padding-bottom: 0.25rem; }
        #users-container, #metrics-container { display: flex; flex-wrap: wrap; gap: 1rem; }
        .card { background: white; padding: 1rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1 1 200px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
        .card h3 { margin-bottom: 0.5rem; color: #2c3e50; }
        .card p { color: #555; }
        footer { margin-top: 4rem; font-size: 0.9rem; color: #7f8c8d; text-align: center; }
        @media (max-width: 768px) { body { padding: 1rem; } h1 { font-size: 2rem; } h2 { font-size: 1.3rem; } }
    </style>
</head>
<body>
    <header>
        <h1>Mini Dashboard</h1>
        <button id="refresh-btn">Refresh Data</button>
    </header>

    <main>
        <section id="users-section">
            <h2>Users</h2>
            <div id="users-container"></div>
        </section>

        <section id="metrics-section">
            <h2>Metrics</h2>
            <div id="metrics-container"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Mini Dashboard</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
